<!DOCTYPE html>
<html>
<head>
    
    <title>Registration</title>
    <link rel="stylesheet" type="text/css" href="registrations.css">
    <link rel="stylesheet" type="text/css" href="form.css">

    <title>Online registration</title>
</head>
<body>

<h1>Online registration</h1>

<form>

<label>Patient name</label><br>
<input type="text" required><br><br>

<label>Age</label><br>
<input type="number" required><br><br>

<label>Gender</label><br>
<input type="radio" name="gender">Male
<input type="radio" name="gender">Female
<br><br>

<label>Mobile number</label><br>
<input type="tel" required><br><br>

<label>Email</label><br>
<input type="email"><br><br>

<label>Date of birth</label><br>
<input type="date"><br><br>

<label>Select urine parameter</label><br>

<select>
<option>Glucose</option>
<option>Protein</option>
<option>Blood</option>
<option>Ketones</option>
<option>pH</option>
<option>Bilirubin</option>
<option>Nitrite</option>
<option>Leucocytes</option>
<option>Specific gravity</option>
</select>

<br><br>

<label>Preferred appointment date</label><br>
<input type="date"><br><br>

<label>Upload doctor prescription</label><br>
<input type="file"><br><br>

<input type="submit" value="Register">

</form>

<br>

<a href="health.html">Back to home</a>

</body>
</html>
